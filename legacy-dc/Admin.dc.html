<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f8f4ef; }
  a { color: #b3875f; text-decoration: none; }
  a:hover { color: #8a6a49; }
</style>
<script src="./image-slot.js"></script>
</helmet>

<div style="font-family:'Work Sans',sans-serif;background:#f8f4ef;min-height:100vh;color:#2b2420;display:flex;">

  <div style="width:220px;flex-shrink:0;background:#2b2420;color:#d8cdbd;padding:32px 24px;min-height:100vh;">
    <div style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:#f1e9df;">beautychoice</div>
    <div style="font-size:12px;color:#8a7f72;margin-top:4px;letter-spacing:0.05em;text-transform:uppercase;">后台管理</div>
    <div style="margin-top:36px;display:flex;flex-direction:column;gap:4px;">
      <div style="padding:10px 12px;background:#3a322c;font-size:14px;font-weight:600;color:#f1e9df;">商品管理</div>
    </div>
    <div style="margin-top:40px;">
      <a href="beautychoice.dc.html" style="font-size:13px;color:#c9a27a;">← 返回商店前台</a>
    </div>
  </div>

  <div style="flex:1;padding:48px 56px;max-width:1200px;">
    <div style="display:flex;align-items:baseline;justify-content:space-between;">
      <div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;">商品管理</div>
        <div style="font-size:14px;color:#8a7f72;margin-top:6px;">共 {{totalCount}} 款商品 · {{categoryCount}} 个分类</div>
      </div>
      <button onClick="{{toggleAddForm}}" style="padding:13px 24px;background:#2b2420;color:#f8f4ef;border:none;font-size:14px;font-weight:600;cursor:pointer;">{{addButtonLabel}}</button>
    </div>

    <sc-if value="{{showAddForm}}" hint-placeholder-val="{{false}}">
      <div style="background:#efe6da;padding:28px;margin-top:24px;">
        <div style="font-size:13px;color:#8a7f72;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:16px;">新增商品</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
          <div>
            <div style="font-size:12px;color:#8a7f72;margin-bottom:6px;">名称</div>
            <input value="{{newName}}" onChange="{{onNewNameChange}}" placeholder="例如：珊瑚渐变 No.01" style="width:100%;padding:12px;border:1px solid #d8cdbd;background:#fff;font-size:14px;font-family:'Work Sans',sans-serif;box-sizing:border-box;" />
          </div>
          <div>
            <div style="font-size:12px;color:#8a7f72;margin-bottom:6px;">分类</div>
            <select value="{{newCategory}}" onChange="{{onNewCategoryChange}}" style="width:100%;padding:12px;border:1px solid #d8cdbd;background:#fff;font-size:14px;font-family:'Work Sans',sans-serif;box-sizing:border-box;">
              <sc-for list="{{categoryOptions}}" as="c" hint-placeholder-count="8">
                <option value="{{c.key}}">{{c.label}}</option>
              </sc-for>
            </select>
          </div>
          <div>
            <div style="font-size:12px;color:#8a7f72;margin-bottom:6px;">价格 (USD)</div>
            <input type="number" value="{{newPrice}}" onChange="{{onNewPriceChange}}" style="width:100%;padding:12px;border:1px solid #d8cdbd;background:#fff;font-size:14px;font-family:'Work Sans',sans-serif;box-sizing:border-box;" />
          </div>
        </div>
        <div style="margin-top:20px;display:flex;gap:12px;">
          <button onClick="{{submitNewProduct}}" style="padding:12px 26px;background:#c9a27a;color:#231d19;border:none;font-size:14px;font-weight:600;cursor:pointer;">添加商品</button>
          <button onClick="{{toggleAddForm}}" style="padding:12px 26px;background:none;border:1px solid #d8cdbd;font-size:14px;cursor:pointer;">取消</button>
        </div>
        <div style="font-size:12px;color:#8a7f72;margin-top:14px;">添加后可在下方列表的图片格里直接拖拽上传商品实拍图。</div>
      </div>
    </sc-if>

    <div style="display:flex;gap:20px;margin-top:32px;border-bottom:1px solid #e3d9cc;padding-bottom:16px;flex-wrap:wrap;">
      <sc-for list="{{filterTabs}}" as="f" hint-placeholder-count="9">
        <div onClick="{{f.onClick}}" style="cursor:pointer;font-size:14px;color:{{f.color}};font-weight:{{f.weight}};white-space:nowrap;">{{f.label}}</div>
      </sc-for>
    </div>

    <div style="margin-top:8px;">
      <div style="display:grid;grid-template-columns:64px 2fr 1.4fr 1fr 80px;gap:16px;padding:14px 0;border-bottom:1px solid #e3d9cc;font-size:12px;color:#8a7f72;letter-spacing:0.05em;text-transform:uppercase;">
        <div>图片</div><div>名称</div><div>分类</div><div>价格</div><div>操作</div>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
        <div style="display:grid;grid-template-columns:64px 2fr 1.4fr 1fr 80px;gap:16px;padding:14px 0;border-bottom:1px solid #ece3d6;align-items:center;">
          <div style="width:56px;height:56px;overflow:hidden;background:#efe6da;">
            <sc-if value="{{r.useSlot}}" hint-placeholder-val="{{false}}">
              <image-slot id="product-{{r.id}}" shape="rect" placeholder="上传" style="width:100%;height:100%;"></image-slot>
            </sc-if>
            <sc-if value="{{r.hasStaticImg}}" hint-placeholder-val="{{false}}">
              <img src="{{r.img}}" alt="{{r.name}}" style="width:100%;height:100%;object-fit:cover;" />
            </sc-if>
          </div>
          <div>
            <input value="{{r.name}}" onChange="{{r.onNameChange}}" style="width:100%;padding:8px 10px;border:1px solid #e3d9cc;background:#fff;font-size:14px;font-family:'Work Sans',sans-serif;box-sizing:border-box;" />
            <div style="font-size:11px;color:#a89685;margin-top:4px;padding-left:2px;">{{r.nameEn}} · {{r.nameFr}}</div>
          </div>
          <select value="{{r.category}}" onChange="{{r.onCategoryChange}}" style="padding:10px;border:1px solid #e3d9cc;background:#fff;font-size:13px;font-family:'Work Sans',sans-serif;">
            <sc-for list="{{categoryOptions}}" as="c" hint-placeholder-count="8">
              <option value="{{c.key}}">{{c.label}}</option>
            </sc-for>
          </select>
          <div style="display:flex;align-items:center;gap:4px;">
            <span style="font-size:13px;color:#8a7f72;">$</span>
            <input type="number" value="{{r.price}}" onChange="{{r.onPriceChange}}" style="width:70px;padding:10px;border:1px solid #e3d9cc;background:#fff;font-size:14px;font-family:'Work Sans',sans-serif;" />
          </div>
          <button onClick="{{r.onDelete}}" style="padding:8px 14px;background:none;border:1px solid #e3d9cc;font-size:13px;color:#8a4a3f;cursor:pointer;">删除</button>
        </div>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = {
    products: [],
    categories: [],
    categoryFilter: 'all',
    showAddForm: false,
    newName: '',
    newCategory: '',
    newPrice: 25,
  };

  componentDidMount() {
    import('./products-data.js').then(mod => {
      this._mod = mod;
      this.setState({ products: mod.loadProducts(), categories: mod.CATEGORIES, newCategory: mod.CATEGORIES[0].key });
    });
  }

  setCategoryFilter = (c) => this.setState({ categoryFilter: c });
  toggleAddForm = () => this.setState(s => ({ showAddForm: !s.showAddForm }));
  setField = (id, field, value) => this.setState(s => ({ products: this._mod.updateProduct(s.products, id, { [field]: value }) }));
  deleteRow = (id) => this.setState(s => ({ products: this._mod.deleteProduct(s.products, id) }));

  submitNewProduct = () => {
    const cat = this.state.categories.find(c => c.key === this.state.newCategory) || this.state.categories[0];
    if (!cat) return;
    const product = {
      id: cat.key + '-new-' + Date.now(),
      category: cat.key,
      categoryLabel: cat.label,
      name: this.state.newName.trim() || (cat.label + ' 新品'),
      price: Number(this.state.newPrice) || 0,
      img: null,
      useSlot: true,
      description: '',
    };
    this.setState(s => ({ products: this._mod.addProduct(s.products, product), showAddForm: false, newName: '', newPrice: 25 }));
  };

  renderVals() {
    const products = this.state.products;
    const categories = this.state.categories;
    const filtered = this.state.categoryFilter === 'all' ? products : products.filter(p => p.category === this.state.categoryFilter);

    const rows = filtered.map(p => ({
      ...p,
      hasStaticImg: !p.useSlot,
      onNameChange: (e) => this.setField(p.id, 'name', e.target.value),
      onPriceChange: (e) => this.setField(p.id, 'price', Number(e.target.value) || 0),
      onCategoryChange: (e) => {
        const cat = categories.find(c => c.key === e.target.value);
        this.setField(p.id, 'category', e.target.value);
        if (cat) this.setField(p.id, 'categoryLabel', cat.label);
      },
      onDelete: () => this.deleteRow(p.id),
    }));

    const filterTabs = [{ key: 'all', label: '全部' }, ...categories]
      .map(f => ({ ...f, onClick: () => this.setCategoryFilter(f.key), color: f.key === this.state.categoryFilter ? '#c9a27a' : '#2b2420', weight: f.key === this.state.categoryFilter ? 700 : 500 }));

    return {
      rows, filterTabs, categoryOptions: categories,
      totalCount: products.length, categoryCount: categories.length,
      showAddForm: this.state.showAddForm, addButtonLabel: this.state.showAddForm ? '收起表单' : '+ 新增商品',
      newName: this.state.newName, newCategory: this.state.newCategory, newPrice: this.state.newPrice,
      onNewNameChange: (e) => this.setState({ newName: e.target.value }),
      onNewCategoryChange: (e) => this.setState({ newCategory: e.target.value }),
      onNewPriceChange: (e) => this.setState({ newPrice: e.target.value }),
      toggleAddForm: this.toggleAddForm, submitNewProduct: this.submitNewProduct,
    };
  }
}

</script>
</body>
</html>
