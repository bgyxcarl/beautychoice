<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{onSelect}}" style="cursor:pointer;display:flex;flex-direction:column;gap:16px;width:100%;">
  <div style="position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;background:#efe6da;">
    <sc-if value="{{product.useSlot}}" hint-placeholder-val="{{false}}">
      <image-slot id="product-{{product.id}}" shape="rect" placeholder="拖拽上传商品图" style="width:100%;height:100%;"></image-slot>
    </sc-if>
    <sc-if value="{{product.hasStaticImg}}" hint-placeholder-val="{{false}}">
      <img src="{{product.img}}" alt="{{product.displayName}}" style="width:100%;height:100%;object-fit:cover;display:block;" />
    </sc-if>
  </div>
  <div>
    <div style="font-family:'Work Sans',sans-serif;font-size:12px;color:#8a7f72;letter-spacing:0.05em;text-transform:uppercase;">{{product.displayCategoryLabel}}</div>
    <div style="font-family:'Cormorant Garamond',serif;font-size:22px;color:#2b2420;margin-top:6px;font-weight:600;">{{product.displayName}}</div>
    <div style="font-family:'Work Sans',sans-serif;font-size:16px;color:#2b2420;margin-top:8px;">{{product.priceLabel}}</div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:400}}"></script>
</body>
</html>
